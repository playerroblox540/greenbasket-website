<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenBasket | Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="settings">
    <div class="page-shell narrow-shell">
      <header class="topbar compact-topbar">
        <div class="brand-wrap">
          <div class="brand-copy brand-text-logo">
            <span class="brand-bold">Green</span>
            <span class="brand-light">Basket</span>
          </div>
        </div>
        <nav class="main-nav" aria-label="Main menu">
          <a class="nav-link" href="index.html">Home</a>
          <button class="nav-link theme-toggle" data-theme-toggle type="button">Dark / Light</button>
          <a class="nav-link" href="applications.html">Applications</a>
          <a class="nav-link" href="staff-login.html">Staff Panel</a>
        </nav>
      </header>

      <main class="panel-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Company settings</p>
            <h1>Website preferences</h1>
          </div>
          <a class="secondary-btn" href="index.html">Back to menu</a>
        </div>

        <div class="settings-form" id="settings-form">
          <div class="setting-row">
            <label>Discord account</label>
            <div class="account-row">
              <div id="discordAccountValue" class="profile-value">N/A</div>
              <button class="secondary-btn small-btn" type="button" data-signout="discord">Log out</button>
            </div>
          </div>

          <div class="setting-row">
            <label>Roblox account</label>
            <div class="account-row">
              <div id="robloxAccountValue" class="profile-value">N/A</div>
              <button class="secondary-btn small-btn" type="button" data-signout="roblox">Log out</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer-bar">
      <a href="terms.html">Terms of Service</a>
      <a href="policy.html">Privacy Policy</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
